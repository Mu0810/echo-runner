<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* Exact canvas: Play requires 512x512, 32-bit PNG. No page margin or the render shifts. */
  html,body{margin:0;padding:0;background:#05060B;width:512px;height:512px;overflow:hidden}
  svg{display:block}
</style></head><body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft washes stand in for the game's fog; they keep the mark from looking flat
         without adding detail that would mush at 48px. -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#B8C9DE" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#B8C9DE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B8C9DE" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#05060B"/>

  <!-- Faint parallax grid, same spacing feel as the in-game background. -->
  <g stroke="#17202F" stroke-width="1.4" opacity="0.85">
    <path d="M0 96H512M0 192H512M0 288H512M0 384H512"/>
    <path d="M96 0V512M192 0V512M288 0V512M384 0V512"/>
  </g>

  <circle cx="300" cy="250" r="190" fill="url(#glowCyan)"/>
  <circle cx="205" cy="270" r="160" fill="url(#glowMag)"/>

  <!-- Ground line: the single bright top edge that defines the game's platforms. -->
  <rect x="40" y="389" width="432" height="3" fill="url(#floorEdge)"/>

  <!-- Same runner glyph as the launcher icon (108-unit artwork scaled 4.74x and shifted),
       so the store listing and the installed icon read as one mark. The magenta figure is
       the Echo: offset, translucent, one step behind. That doubling IS the game. -->
  <g transform="translate(26, 30) scale(4.74)">
    <!-- Echo, behind -->
    <g opacity="0.5">
      <circle cx="44" cy="34" r="6" fill="#E879F9"/>
      <path d="M42,44 L48,44 L52,58 L47,60 L43,51 L43,74 L37,74 L37,61 L31,74 L25,72 L33,55 Z" fill="#E879F9"/>
    </g>
    <!-- Player, in front -->
    <circle cx="62" cy="34" r="7" fill="#22D3EE"/>
    <path d="M60,44 L67,44 L72,60 L66,62 L62,52 L62,76 L55,76 L55,62 L48,76 L41,74 L50,56 Z" fill="#22D3EE"/>
  </g>

  <!-- Vignette, matching the renderer's. -->
  <rect width="512" height="512" fill="none" stroke="#05060B" stroke-width="26" opacity="0.55"/>
</svg>
</body></html>
